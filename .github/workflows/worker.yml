name: Worker

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # manual trigger

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run worker (4 min max)
        # timeout sends SIGTERM at 240 s; the worker's SIGTERM handler releases
        # the advisory lock and calls process.exit(0), so timeout exits 0.
        # --kill-after=15 sends SIGKILL if the process hasn't exited within 15 s
        # of SIGTERM; that produces exit 124, which correctly fails the step.
        run: timeout --kill-after=15 240 npx tsx src/worker/index.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USEAPI_TOKEN: ${{ secrets.USEAPI_TOKEN }}
          GOOGLE_FLOW_EMAIL: work.ankitmahindru@gmail.com
          SUPABASE_BUCKET_VIDEOS: videos
