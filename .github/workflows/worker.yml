name: Worker

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # manual trigger

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run worker (4 min max)
        run: |
          timeout 240 npx tsx src/worker/index.ts
          code=$?
          # exit 0: normal run or "another worker holds lock"
          # exit 124: timeout killed the process (expected after 4 min)
          # any other exit code: fatal worker error → fail the CI step
          if [ $code -eq 0 ] || [ $code -eq 124 ]; then exit 0; else exit $code; fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USEAPI_TOKEN: ${{ secrets.USEAPI_TOKEN }}
          GOOGLE_FLOW_EMAIL: work.ankitmahindru@gmail.com
          SUPABASE_BUCKET_VIDEOS: videos
